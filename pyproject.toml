[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meadowlark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["meadowlark*"]

[tool.pytest.ini_options]
addopts = "--cov"

[tool.coverage.run]
source = ["meadowlark"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meadowlark"]
plugins = ["pydantic.mypy"]
