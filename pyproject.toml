[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meadowlark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["meadowlark*"]

[tool.pytest.ini_options]
addopts = "--cov"

[tool.coverage.run]
source = ["meadowlark"]

[tool.coverage.report]
fail_under = 95
show_missing = true
